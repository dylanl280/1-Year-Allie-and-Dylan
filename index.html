<html lang="en">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Year Together — Allie & Dylan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(ellipse at 30% 20%, #ede0f7 0%, #e8d5f5 35%, #f0e8f5 60%, #faf5fc 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', Georgia, serif;
      overflow: hidden;
      user-select: none;
    }

    /* ── Layout ── */
    .scene {
      display: flex;
      align-items: center;
      gap: 28px;
      position: relative;
    }

    .page-wrapper {
      width: 480px;
      height: min(660px, calc(100dvh - 110px));
      position: relative;
    }

    /* ── Page base ── */
    .page {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #fdf5ff 0%, #fefcff 50%, #f9f1fd 100%);
      border-radius: 3px 18px 18px 3px;
      box-shadow:
        5px 5px 24px rgba(107, 61, 138, 0.18),
        10px 10px 50px rgba(107, 61, 138, 0.08),
        -3px 0 10px rgba(0,0,0,0.06),
        inset -1px 0 0 rgba(180,140,210,0.15);
      padding: 38px 44px 32px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(6px) scale(0.99);
      transition: opacity 0.38s ease, transform 0.38s ease;
      pointer-events: none;
      overflow: hidden;
    }

    .page::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 8px;
      background: linear-gradient(to right, #c4a0d8 0%, #e0c8f0 60%, transparent 100%);
      border-radius: 3px 0 0 3px;
    }

    .page.active {
      opacity: 1;
      transform: none;
      pointer-events: all;
    }

    /* ── Floral corners ── */
    .fc {
      position: absolute;
      font-size: 16px;
      color: #c0a0d4;
      opacity: 0.55;
      line-height: 1;
    }
    .fc-tl { top: 14px; left: 18px; }
    .fc-tr { top: 14px; right: 14px; }
    .fc-bl { bottom: 12px; left: 18px; }
    .fc-br { bottom: 12px; right: 14px; }

    /* ── Cover ── */
    .cover-page {
      background: url('Floral 2.png') center/cover no-repeat;
      justify-content: center;
      gap: 0;
    }

    .cover-garland {
      font-size: 26px;
      letter-spacing: 10px;
      color: #a870cc;
      margin-bottom: 28px;
      opacity: 0.75;
    }

    .cover-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 17px;
      font-weight: 400;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #7a45a0;
      text-align: center;
    }

    .cover-names {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 42px;
      font-weight: 400;
      font-style: italic;
      color: #5e2d85;
      text-align: center;
      margin-top: 10px;
      line-height: 1.2;
    }

    .cover-rule {
      width: 140px;
      height: 1px;
      background: linear-gradient(to right, transparent, #b88ad4, transparent);
      margin: 22px auto 8px;
    }

    .cover-love {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 20px;
      font-style: italic;
      color: #7a45a0;
      text-align: center;
      margin-bottom: 6px;
    }

    .cover-year {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #9060b8;
      text-align: center;
      margin-top: 34px;
    }

    .cover-tagline {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 16px;
      font-style: italic;
      color: #a878c8;
      text-align: center;
      margin-top: 10px;
    }

    .cover-garland-bot {
      font-size: 22px;
      letter-spacing: 8px;
      color: #a870cc;
      margin-top: 30px;
      opacity: 0.65;
    }

    /* ── Photo page ── */
    .photo-page {
      justify-content: space-between;
      background:
        linear-gradient(160deg, rgba(253, 245, 255, 0.87) 0%, rgba(254, 252, 255, 0.87) 50%, rgba(249, 241, 253, 0.87) 100%),
        url('Final Floral.png') center / cover no-repeat;
    }

    .photo-page::after {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(180, 130, 210, 0.18);
      border-radius: 8px;
      pointer-events: none;
    }

    .photo-frame {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    .photo-frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 3px;
      border: 1px solid rgba(160, 110, 200, 0.35);
      box-shadow:
        0 3px 12px rgba(107, 61, 138, 0.18),
        0 1px 4px rgba(107, 61, 138, 0.12);
      display: block;
    }

    .page-meta {
      width: 100%;
      padding-top: 14px;
      border-top: 1px solid #e2ceee;
      text-align: center;
      flex-shrink: 0;
    }

    .page-date {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 13px;
      font-style: italic;
      color: #8850b4;
      letter-spacing: 0.5px;
    }

    .page-location {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 11px;
      color: #8850b4;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .caption-input {
      width: 100%;
      margin-top: 12px;
      border: 1px solid rgba(180, 130, 210, 0.25);
      border-radius: 5px;
      background: rgba(180, 130, 210, 0.05);
      outline: none;
      resize: none;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 14px;
      font-style: italic;
      color: #6a3d8a;
      text-align: center;
      line-height: 1.6;
      padding: 6px 10px 8px;
      min-height: 34px;
      overflow: hidden;
      user-select: text;
      cursor: text;
    }

    .caption-input::placeholder {
      color: #c4a0d8;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-style: normal;
    }

    .page-num {
      font-size: 10px;
      color: #a882c8;
      letter-spacing: 2px;
      margin-top: 8px;
    }

    /* ── Letter page ── */
    .letter-page {
      justify-content: flex-start;
    }

    .letter-salutation {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 22px;
      font-style: italic;
      color: #5e2d85;
      align-self: flex-start;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .letter-rule {
      width: 100%;
      height: 1px;
      background: linear-gradient(to right, #d4b0e8, transparent);
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .letter-input {
      width: 100%;
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      resize: none;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 15px;
      font-style: italic;
      color: #4a2868;
      line-height: 2;
      padding: 0 4px;
      user-select: text;
      cursor: text;
      overflow-y: auto;
    }

    .letter-input::placeholder {
      color: #d4b8e4;
      font-size: 13px;
      letter-spacing: 1px;
    }

    /* ── Closing ── */
    .closing-page {
      background: url('Floral 2.png') center/cover no-repeat;
      justify-content: center;
      gap: 0;
    }

    .closing-garland {
      font-size: 24px;
      letter-spacing: 8px;
      color: #a870cc;
      margin-bottom: 30px;
      opacity: 0.7;
    }

    .closing-text {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 24px;
      font-style: italic;
      font-weight: 400;
      color: #5e2d85;
      text-align: center;
      line-height: 1.65;
    }

    .closing-rule {
      width: 100px;
      height: 1px;
      background: linear-gradient(to right, transparent, #b88ad4, transparent);
      margin: 26px auto;
    }

    .closing-sub {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #9060b8;
      text-align: center;
    }

    /* ── Nav buttons ── */
    .nav-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 1px solid rgba(180, 140, 210, 0.5);
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(6px);
      color: #7040a8;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      line-height: 1;
    }

    .nav-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 4px 18px rgba(107, 61, 138, 0.22);
      transform: scale(1.07);
    }

    .nav-btn:disabled {
      opacity: 0.25;
      cursor: default;
    }

    /* ── Bottom indicator ── */
    .bottom-bar {
      margin-top: 22px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .indicator {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 12px;
      color: #9868b8;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      min-width: 120px;
      text-align: center;
    }

    .dot-nav {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #d4b0e8;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .dot.active {
      background: #8040b0;
      transform: scale(1.3);
    }

    /* ── Letter GIFs ── */
    .scene-gif {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 160px;
      height: 160px;
      object-fit: contain;
      border-radius: 16px;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    .scene-gif.visible { opacity: 1; }
    #gifLeft  { left: 48px; }
    #gifRight { right: 48px; }

  </style>
</head>

function buildPage(p) {
  const el = document.createElement('div');

  if (p.type === 'cover') {
    el.className = 'page cover-page';
    el.innerHTML = `
      <div class="fc fc-tl">✿</div><div class="fc fc-tr">✿</div>

      <div class="cover-tagline">A year of moments, all ours.</div>
      <div class="cover-garland-bot">❀ &nbsp; ✦ &nbsp; ❀</div>
    `;
  } else if (p.type === 'letter') {
    el.className = 'page letter-page';

      <div class="fc fc-bl">✿</div><div class="fc fc-br">✿</div>

        <div class="page-num">${p.n} &nbsp;/&nbsp; 51</div>
      </div>
    `;
  }
  return el;
}

// Load captions — localStorage overrides hard-coded for future edits
wrapper.querySelectorAll('.caption-input').forEach(ta => {
  const key = 'caption_' + ta.dataset.page;
  ta.value = localStorage.getItem(key) || CAPTIONS[ta.dataset.page] || '';
  autoResize(ta);
  ta.addEventListener('input', () => {
    localStorage.setItem(key, ta.value);
    autoResize(ta);
  });
});

// Letter textarea
const letterTa = wrapper.querySelector('.letter-input');
if (letterTa) {
  letterTa.value = localStorage.getItem('letter') || LETTER;
  letterTa.addEventListener('input', () => localStorage.setItem('letter', letterTa.value));
}

function autoResize(ta) {
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
}

const gifLeft  = document.getElementById('gifLeft');
const gifRight = document.getElementById('gifRight');

function sync() {
  els.forEach((el, i) => el.classList.toggle('active', i === cur));
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === TOTAL - 1;
  const p = PAGES[cur];
  const onLetter = p.type === 'letter';
  gifLeft.classList.toggle('visible', onLetter);
  gifRight.classList.toggle('visible', onLetter);
  if (p.type === 'cover') indicator.textContent = '';
  else if (p.type === 'closing') indicator.textContent = '';
  else if (p.type === 'letter') indicator.textContent = 'I love you Allie!';
  else indicator.textContent = `Page ${p.n} of 51`;
}

function go(dir) {
  const next = cur + dir;
  if (next < 0 || next >= TOTAL) return;
  cur = next;
  sync();
}

document.addEventListener('keydown', e => {
  const active = document.activeElement;
  if (active && (active.classList.contains('caption-input') || active.classList.contains('letter-input'))) return;
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft')  go(-1);
});


let tx = 0;
wrapper.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
wrapper.addEventListener('touchend',   e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 48) go(dx < 0 ? 1 : -1);
}, { passive: true });

sync();
</script>
